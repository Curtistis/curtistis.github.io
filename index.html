<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品集</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161b; --card:#1d2027; --text:#e6e8ec; --muted:#9aa3b2; --line:#2c303a; --accent:#6b9bff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width:880px; margin:0 auto; padding:40px 16px 64px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 32px; }
  h2 { font-size:16px; margin:32px 0 12px; color:var(--muted); font-weight:600; letter-spacing:.02em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
  a.card:hover { border-color:var(--accent); transform:translateY(-1px); }
  .card b { display:block; font-size:15px; margin-bottom:4px; }
  .card span { color:var(--muted); font-size:13px; }
  .tags { margin-top:8px; font-size:12px; color:var(--accent); }
  footer { margin-top:48px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>作品集</h1>
  <p class="sub">CS 学生 · C / C++ / Java / Python · 数据可视化与 3D 交互。每个项目点开即可在浏览器里直接运行。</p>

  <!-- 新增项目:复制一个 <a class="card"> 改链接和文字即可;新类别就复制整个 <section> -->

  <section>
    <h2>3D 交互</h2>
    <div class="grid">
      <a class="card" href="3d/hexapod/">
        <b>六轴外固定架 · 矫正处方演示</b>
        <span>输入骨骼畸形参数，用并联机构逆运动学算出每天 6 根杆的长度，并用 3D 动画演示复位过程。</span>
        <div class="tags">Three.js · 线性代数 · 逆运动学</div>
      </a>
    </div>
  </section>

  <section>
    <h2>数据可视化</h2>
    <div class="grid">
      <a class="card" href="csv-insight/">
        <b>CSV 数据洞察看板</b>
        <span>拖入 CSV 自动完成字段画像、统计摘要、相关性热力图、趋势与分组聚合，数据只在本地浏览器处理。</span>
        <div class="tags">ECharts · PapaParse · 原生 JS</div>
      </a>
    </div>
  </section>

  <footer>托管于 GitHub Pages</footer>
</main>
</body>
</html>
